name: Automated Tests
on: pull_request
jobs:
  bun-test-runner:
    name: Bun Test Runner Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - run: bun ci
      - run: bun run test
